name: Import initial website source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-source.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the initial source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f website-source.zip ]; then
            echo "Source is already imported. Nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          with ZipFile('website-source.zip') as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts or '.github' in path.parts:
                      raise ValueError('Unsafe source archive path')
              archive.extractall('.')
          Path('website-source.zip').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import complete verified Astro website source"
          git push
